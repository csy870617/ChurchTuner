<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Church Tuner Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.4">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="brand-bar">
                <span class="logo-icon">✝️</span>
                <span class="logo-text">CHURCH TUNER</span>
                <div id="status-dot"></div>
            </div>
        </header>

        <main>
            <div class="tuner-display-area">
                <div id="guide-msg">TAP START TO TUNE</div>

                <div class="note-wrapper">
                    <span id="note-name">--</span>
                    <span id="octave"></span>
                </div>
                
                <div class="gauge-container">
                    <svg class="gauge-svg" viewBox="0 0 200 100">
                        <path class="gauge-track" d="M 10 100 A 90 90 0 0 1 190 100" fill="none" stroke-width="4" stroke-linecap="round"/>
                        <line class="center-marker" x1="100" y1="10" x2="100" y2="30" stroke-width="3" stroke-linecap="round"/>
                        <g id="needle-group" transform="rotate(0, 100, 100)">
                            <line class="needle" x1="100" y1="100" x2="100" y2="20" stroke-width="4" stroke-linecap="round"/>
                             <circle class="needle-base" cx="100" cy="100" r="8" />
                        </g>
                    </svg>
                     <div class="cents-display" id="cents">0</div>
                </div>
            </div>

            <div class="frequency-info">
                <span id="frequency">0.0 Hz</span>
            </div>
        </main>

        <footer>
            <div class="control-panel">
                <button id="start-btn">
                    <div class="btn-content">
                        <span class="mic-icon">🎙️</span>
                        <span class="btn-text">ACTIVATE</span>
                    </div>
                </button>
                
                <div class="instrument-selector">
                    <div class="inst-pill active" data-type="guitar">🎸 GUITAR</div>
                    <div class="inst-pill" data-type="bass">🎸 BASS</div>
                    <div class="inst-pill" id="dynamic-inst-card" data-type="select">
                        <span id="dyn-icon">🎵</span> <span id="dyn-name">SELECT</span>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <div id="inst-modal" class="modal hidden">
        <div class="modal-glass">
            <div class="modal-header">
                <h3>SELECT INSTRUMENT</h3>
                <button id="close-modal">✕</button>
            </div>
            <div id="modal-list" class="modal-list"></div>
        </div>
    </div>

    <script src="script.js?v=2.4"></script>
</body>
</html>
