<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f8f6f2">
    <meta name="color-scheme" content="light dark">
    <script>
        // 저장된 테마를 CSS보다 먼저 적용해 새로고침 시 밝은 화면이 번쩍이지 않도록
        try {
            if (localStorage.getItem('churchtuner-theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111317');
            }
        } catch (e) {}
    </script>
    <meta name="description" content="Church Tuner — guitar, bass, ukulele, violin, cello and chromatic tuner.">
    <title>Church Tuner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c0f'/%3E%3Cpath d='M16 7v18M10.5 12.5h11' stroke='%233ddc97' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5.3">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 4v16M7.5 9h9"/></svg>
                </span>
                <span class="brand-name">Church Tuner</span>
            </div>
            <div class="topbar-actions">
                <div class="status">
                    <span id="status-dot" aria-hidden="true"></span>
                    <span id="status-text">Off</span>
                </div>
                <button id="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" title="Dark mode">
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
                </button>
            </div>
        </header>

        <main class="stage">
            <p id="guide-msg" class="guide" aria-live="polite">Tap start to tune</p>

            <div class="note" role="group" aria-label="Detected note">
                <span id="note-name" class="note-letter"></span>
                <span class="note-meta">
                    <span id="note-accidental" class="note-accidental"></span>
                    <span id="octave" class="note-octave"></span>
                </span>
            </div>

            <div class="meter">
                <svg class="gauge" viewBox="0 0 240 138" aria-hidden="true">
                    <g id="gauge-ticks"></g>
                    <g id="needle-group" transform="rotate(0 120 128)">
                        <line class="needle" x1="120" y1="128" x2="120" y2="34"/>
                    </g>
                    <circle class="needle-hub" cx="120" cy="128" r="6"/>
                </svg>
            </div>

            <div class="readout">
                <div class="readout-cell">
                    <span class="readout-label">Cents</span>
                    <span id="cents" class="readout-value readout-cents">—</span>
                </div>
                <div class="readout-cell">
                    <span class="readout-label">Detected</span>
                    <span id="frequency" class="readout-value">— Hz</span>
                </div>
                <div class="readout-cell">
                    <span class="readout-label">Target</span>
                    <span id="target-note" class="readout-value">— Hz</span>
                </div>
            </div>

            <div id="string-row" class="strings" aria-hidden="true"></div>
        </main>

        <footer class="dock">
            <div class="segmented" role="group" aria-label="Instrument">
                <button type="button" class="inst-pill active" data-type="guitar" aria-pressed="true">Guitar</button>
                <button type="button" class="inst-pill" data-type="bass" aria-pressed="false">Bass</button>
                <button type="button" class="inst-pill" id="dynamic-inst-card" data-type="select" aria-pressed="false" aria-haspopup="dialog">
                    <span id="dyn-name">More</span>
                    <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg>
                </button>
            </div>
            <button id="start-btn" type="button" class="primary-btn">
                <svg class="mic" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="9" y="3" width="6" height="11" rx="3"/>
                    <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
                </svg>
                <span class="btn-text">Start tuning</span>
            </button>
        </footer>
    </div>

    <div id="inst-modal" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
        <div class="sheet-panel">
            <div class="sheet-header">
                <h2 id="modal-title">Instrument</h2>
                <button id="close-modal" type="button" aria-label="Close instrument selector">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                </button>
            </div>
            <div id="modal-list" class="sheet-list"></div>
        </div>
    </div>

    <script src="script.js?v=5.3"></script>
</body>
</html>
